# validation pass: 2026-08-22
name: Temporary GFW boundary research

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gfw-boundary-research.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/meratus-boundaries-20260822
          fetch-depth: 0
      - name: Validate GFW matches against dossier locations
        run: |
          set -euo pipefail
          python -m pip install --quiet shapely
          python - <<'PY'
          import json, math, re
          from pathlib import Path
          from collections import Counter
          from shapely.geometry import shape, Point
          from shapely.validation import explain_validity

          raw=json.loads(Path('research-output/gfw_staging_matches.geojson').read_text())
          dossiers=json.loads(Path('data/dossiers.json').read_text())['dossiers']
          dossier={d['id']:d for d in dossiers}
          expected={
            'bsg':'BAGUS SENTOSA GEMILANG',
            'thm1':'TRI H.M 1',
            'thm2':'TRI H.M 2',
            'lar':'LESTARI ALAM RAYA',
            'sum':'SUMATERA UNGGUL MAKMUR',
          }
          def norm(v):
              s=str(v or '').upper()
              s=re.sub(r'\bPT\.?\b',' ',s)
              s=re.sub(r'[^A-Z0-9]+',' ',s)
              return ' '.join(s.split())
          def clean(node):
              if isinstance(node,list):
                  if len(node)>=2 and isinstance(node[0],(int,float)) and isinstance(node[1],(int,float)):
                      return [float(node[0]),float(node[1])]
                  return [clean(x) for x in node]
              raise TypeError(type(node).__name__)
          def hav_km(lat1,lon1,lat2,lon2):
              R=6371.0088
              p1,p2=math.radians(lat1),math.radians(lat2)
              dp=math.radians(lat2-lat1); dl=math.radians(lon2-lon1)
              a=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(a))
          report={'ok':True,'expectedCount':5,'count':0,'counts':{},'items':[],'errors':[]}
          counts=Counter()
          for f in raw.get('features',[]):
              p=f.get('properties') or {}; did=p.get('_researchDossierId')
              if did not in expected:
                  report['errors'].append(f'unexpected dossierId {did!r}'); continue
              counts[did]+=1
              company=(p.get('company') or p.get('name') or '').strip()
              name_ok=norm(company)==norm(expected[did])
              geom_data={'type':f['geometry']['type'],'coordinates':clean(f['geometry']['coordinates'])}
              geom=shape(geom_data)
              minx,miny,maxx,maxy=geom.bounds
              bbox_ok=minx>=108.0 and miny>=-4.6 and maxx<=119.5 and maxy<=1.85
              topo_ok=geom.is_valid and not geom.is_empty and geom.area>0
              d=dossier[did]
              lat,lon=d['centroid']
              point=Point(lon,lat)
              contains=geom.covers(point)
              nearest=geom.representative_point()
              centroid_dist=hav_km(lat,lon,nearest.y,nearest.x)
              item={
                'dossierId':did,'dossierName':d['name'],'dossierProvince':d.get('province'),
                'dossierCentroidLatLon':[lat,lon],
                'sourceObjectId':p.get('objectid_1'),'sourceCompany':company,'nameExactAfterPtPunctuationNormalization':name_ok,
                'poLegalStatus':p.get('po_legalst'),'poHgu':p.get('po_hgu'),'poAreaHgu':p.get('po_area_hg'),
                'areaHa':p.get('area_ha'),'groupCompany':p.get('group_comp'),'sourceField':p.get('source'),'gfwid':p.get('gfwid'),
                'geometryType':geom_data['type'],'bounds':[minx,miny,maxx,maxy],
                'valid':geom.is_valid,'validity':explain_validity(geom),'empty':geom.is_empty,
                'bboxKalimantanIndonesiaScreen':bbox_ok,'coordinateDimensions':2,
                'dossierCentroidCoveredByPolygon':contains,
                'distanceDossierCentroidToPolygonRepresentativePointKm':round(centroid_dist,1),
              }
              if not (name_ok and bbox_ok and topo_ok):
                  report['errors'].append(f'{did}: failed name/bbox/topology validation')
              report['items'].append(item)
          report['count']=sum(counts.values()); report['counts']=dict(sorted(counts.items()))
          if set(counts)!=set(expected) or any(counts[k]!=1 for k in expected):
              report['errors'].append(f'expected exactly one record per target; got {dict(counts)}')
          report['ok']=not report['errors']
          Path('research-output/gfw_validation_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - name: Persist validation report
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research-output/gfw_validation_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: validate GFW oil palm boundary matches'
          git push origin HEAD:research/meratus-boundaries-20260822
