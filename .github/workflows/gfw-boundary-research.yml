# promotion pass: 2026-08-22
name: Temporary promote merged MERATUS boundaries

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gfw-boundary-research.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch merged validated boundary dataset
        run: |
          set -euo pipefail
          git fetch origin research/meratus-boundaries-20260822
          git show origin/research/meratus-boundaries-20260822:research-output/merged_boundaries.geojson > data/boundaries.geojson
          git show origin/research/meratus-boundaries-20260822:research-output/merged_validation_report.json > /tmp/merged_validation_report.json
      - name: Independently validate before promotion
        run: |
          set -euo pipefail
          python -m pip install --quiet shapely
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from shapely.geometry import shape
          from shapely.validation import explain_validity

          data=json.loads(Path('data/boundaries.geojson').read_text())
          report=json.loads(Path('/tmp/merged_validation_report.json').read_text())
          expected={'agm':2,'bre':1,'bsg':1,'dwima':1,'kiani':1,'kpc':1,'lar':1,'sum':1}
          assert report.get('ok') is True
          assert report.get('featureCount') == 9
          assert report.get('counts') == expected
          assert data.get('type') == 'FeatureCollection'
          feats=data.get('features',[])
          assert len(feats) == 9
          counts=Counter()
          qualities=Counter()

          def positions(node):
              if isinstance(node,list) and len(node)==2 and all(isinstance(v,(int,float)) for v in node):
                  yield node
              elif isinstance(node,list):
                  for x in node: yield from positions(x)

          for f in feats:
              assert f.get('type') == 'Feature'
              p=f.get('properties') or {}
              did=p.get('dossierId')
              assert did in expected
              counts[did]+=1
              q=p.get('quality'); qualities[q]+=1
              assert q in {'OFFICIAL','GFW'}
              assert isinstance(p.get('name'),str) and p['name']
              assert isinstance(p.get('source'),str) and p['source']
              assert isinstance(p.get('sourceUrl'),str) and p['sourceUrl'].startswith('https://')
              if q=='OFFICIAL':
                  assert 'Badan Informasi Geospasial' in p['source']
                  assert p['sourceUrl'].startswith('https://kspservices.big.go.id/')
              if q=='GFW':
                  assert did in {'bsg','lar','sum'}
                  assert 'Global Forest Watch / WRI legacy' in p['source']
                  assert 'not proof of current 2026 HGU' in p['source']
                  assert p['sourceUrl']=='https://gfw-staging.wri.org/arcgis/rest/services/country_data/asia/MapServer/2'
              g=f.get('geometry') or {}
              assert g.get('type') in {'Polygon','MultiPolygon'}
              pts=list(positions(g.get('coordinates')))
              assert pts
              assert all(108.0 <= pt[0] <= 119.5 and -4.6 <= pt[1] <= 1.85 for pt in pts)
              geom=shape(g)
              assert not geom.is_empty
              assert geom.is_valid, explain_validity(geom)
              assert geom.area>0
          assert dict(sorted(counts.items()))==expected
          assert qualities==Counter({'OFFICIAL':6,'GFW':3})
          assert not ({'kideco','adaro','thm1','thm2'} & set(counts))
          print('validated',len(feats),'features',dict(counts),dict(qualities))
          PY
      - name: Commit promoted boundary data
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/boundaries.geojson
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: add verified GFW oil-palm concession boundaries'
          git push origin HEAD:main
