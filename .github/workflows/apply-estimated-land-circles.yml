name: Apply estimated land circles

on:
  push:
    branches:
      - feat/estimated-land-circles
    paths:
      - .github/workflows/apply-estimated-land-circles.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/estimated-land-circles
          fetch-depth: 0

      - name: Patch data and dashboard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data_path = Path('data/affiliated-land-holdings.json')
          payload = json.loads(data_path.read_text(encoding='utf-8'))

          centers = {
              'jarr-hgu': {
                  'lat': -3.2860090903,
                  'lon': 116.0789532738,
                  'precision': 'operational-site reference',
                  'label': 'Batu Ampar / Simpang Empat, Tanah Bumbu',
                  'source': 'JARR official profile confirms Batu Ampar operational locality; published company profile provides map coordinate.',
                  'sourceUrl': 'https://www.ptjar.com/Profil_Perusahaan'
              },
              'pgun-hgu': {
                  'lat': -2.2288611111,
                  'lon': 116.0756666667,
                  'precision': 'district-center approximation',
                  'label': 'Batu Engau, Paser',
                  'source': 'PGUN annual report places operations in Batu Engau; center uses published Batu Engau administrative coordinate.',
                  'sourceUrl': 'https://pradiksi.co.id/upload/files/1746007290_AR%20PT%20PGUN%202024.pdf'
              },
              'jam-pbph': {
                  'lat': -3.1607694444,
                  'lon': 115.6918555556,
                  'precision': 'published concession reference point',
                  'label': 'Jhonlin Agro Mandiri reference point',
                  'source': 'AidEnvironment satellite figure labels a point inside/adjacent to the mapped Jhonlin Agro Mandiri concession.',
                  'sourceUrl': 'https://www.aidenvironment.org/wp-content/uploads/2021/08/The-need-for-cross-commodity-no-deforestation-policies-by-Aidenvironment.pdf'
              },
              'inni-joa-pbph': {
                  'lat': -3.4836339111,
                  'lon': 115.9479384,
                  'precision': 'regency-center approximation',
                  'label': 'Tanah Bumbu',
                  'source': 'Government planning material places PT Inni Joa in Tanah Bumbu; center is the regency reference coordinate, not a concession centroid.',
                  'sourceUrl': 'https://pktl.menlhk.go.id/assets/img/publication/Buku_Renja_Bidang_I_IDN.pdf'
              },
              'kodeco-timber-pbph': {
                  'lat': -3.1104669556,
                  'lon': 115.9296192,
                  'precision': 'multi-regency midpoint approximation',
                  'label': 'Kotabaru / Tanah Bumbu',
                  'source': 'KLHK basis data places the permit across Kotabaru and Tanah Bumbu; center is a display midpoint, not a concession centroid.',
                  'sourceUrl': 'https://phl.menlhk.go.id/static/file/publikasi/1612239357-BUKUBASISDATAGEOSPASIAL2020.pdf'
              },
              'taiyoung-engreen-pbph': {
                  'lat': -1.4084722222,
                  'lon': 113.7740277778,
                  'precision': 'published-bounds midpoint',
                  'label': 'Gunung Mas, Kalimantan Tengah',
                  'source': 'Center is the midpoint of the published geographic bounds for PT Taiyoung Engreen.',
                  'sourceUrl': 'https://repository.umpr.ac.id/331/15/BAB%20II.pdf'
              }
          }

          for holding in payload.get('holdings', []):
              center = centers.get(holding.get('id'))
              if center:
                  holding['displayCenter'] = center

          payload['meta']['estimatedDisplayGeometry'] = True
          caveat = 'Dashboard circles are schematic equal-area displays derived from reported areaHa. They are not legal concession boundaries; display centers may also be approximate as labeled per holding.'
          if caveat not in payload['meta'].setdefault('caveats', []):
              payload['meta']['caveats'].append(caveat)

          data_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    .legend .boundary-none { border: 1px dashed var(--warn); background: transparent; }',
              '    .legend .boundary-none { border: 1px dashed var(--warn); background: transparent; }\n'
              '    .legend .estimated-land { width: 12px; height: 12px; border: 2px dashed #6f9fc8; border-radius: 50%; background: rgba(111,159,200,0.08); }',
              'legend css'
          )

          replace_once(
              '          <div><span class="boundary-approx"></span>PERKIRAAN boundary</div>\n          <div><span class="boundary-none"></span>Location only / no boundary</div>',
              '          <div><span class="boundary-approx"></span>PERKIRAAN boundary</div>\n'
              '          <div><span class="estimated-land"></span>PERKIRAAN LUAS IZIN · bukan batas legal</div>\n'
              '          <div><span class="boundary-none"></span>Location only / no boundary</div>',
              'legend html'
          )

          replace_once(
              '      loadJson("data/boundaries.geojson").catch(function () {\n        return { type: "FeatureCollection", features: [] };\n      }),\n      loadJson("data/firms-status.json").catch(function () { return null; })\n    ]).then(function (pair) {\n      boot(pair[0], pair[1], pair[2], pair[3]);',
              '      loadJson("data/boundaries.geojson").catch(function () {\n        return { type: "FeatureCollection", features: [] };\n      }),\n'
              '      loadJson("data/firms-status.json").catch(function () { return null; }),\n'
              '      loadJson("data/affiliated-land-holdings.json").catch(function () { return { meta: {}, people: [], holdings: [] }; })\n'
              '    ]).then(function (pair) {\n      boot(pair[0], pair[1], pair[2], pair[3], pair[4]);',
              'dataset loading'
          )

          replace_once(
              '    function boot(firmsPayload, dossierPayload, boundariesGeo, pipelineStatusPayload) {\n    var firms = [];',
              '    function boot(firmsPayload, dossierPayload, boundariesGeo, pipelineStatusPayload, affiliatedPayload) {\n'
              '    var firms = [];',
              'boot signature'
          )

          replace_once(
              '    var walhi = dossierPayload.walhiSummary || null;\n    var boundaryById = {};',
              '    var walhi = dossierPayload.walhiSummary || null;\n'
              '    var landHoldings = affiliatedPayload && Array.isArray(affiliatedPayload.holdings) ? affiliatedPayload.holdings : [];\n'
              '    var landPeople = affiliatedPayload && Array.isArray(affiliatedPayload.people) ? affiliatedPayload.people : [];\n'
              '    var landPeopleById = {};\n'
              '    landPeople.forEach(function (p) { landPeopleById[p.id] = p; });\n'
              '    var boundaryById = {};',
              'land variables'
          )

          replace_once(
              '      elHeaderStats.textContent = count.toLocaleString("id-ID") + " FIRMS detections · " + dossiers.length + " dossiers · " + mapped + "/" + dossiers.length + " boundaries mapped";',
              '      elHeaderStats.textContent = count.toLocaleString("id-ID") + " FIRMS detections · " + dossiers.length + " WALHI dossiers · " + landHoldings.length + " affiliated land holdings · " + mapped + "/" + dossiers.length + " boundaries mapped";',
              'header stats'
          )

          replace_once(
              '    var concessionLayer = L.layerGroup().addTo(map);\n    var regionLayer = L.layerGroup().addTo(map);',
              '    var concessionLayer = L.layerGroup().addTo(map);\n'
              '    var estimatedLandLayer = L.layerGroup().addTo(map);\n'
              '    var regionLayer = L.layerGroup().addTo(map);',
              'map layer'
          )

          marker = '    function refreshConcessionMarkers() {'
          if text.count(marker) != 1:
              raise SystemExit('refreshConcessionMarkers marker mismatch')

          holding_helpers = r'''
    function estimatedLandRadiusMeters(areaHa) {
      var hectares = Number(areaHa);
      if (!isFinite(hectares) || hectares <= 0) return 0;
      return Math.sqrt((hectares * 10000) / Math.PI);
    }

    function formatAreaHa(areaHa) {
      var value = Number(areaHa);
      return isFinite(value) ? value.toLocaleString("id-ID", { maximumFractionDigits: 2 }) + " ha" : "luas tidak tersedia";
    }

    function showLandHolding(h) {
      state.selectedId = h.id;
      state.selectedType = "landholding";
      var center = h.displayCenter || {};
      var control = h.control || {};
      var persons = (control.persons || []).map(function (link) {
        var p = landPeopleById[link.personId];
        return '<div class="tie-card"><strong>' + escapeHtml(p ? p.name : link.personId) + '</strong><br/><span class="tie-meta">' + escapeHtml((p && p.relationToHajiIsam ? p.relationToHajiIsam + ' · ' : '') + (link.role || 'role tidak dinyatakan')) + '</span></div>';
      }).join("") || '<div class="insp-empty">Tidak ada person yang dikunci.</div>';
      var sources = (h.sources || []).map(function (s) {
        return '<li><a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.label || s.type || 'source') + '</a></li>';
      }).join("");
      var caves = (h.caveats || []).map(function (c) { return '<div class="caveat">' + escapeHtml(c) + '</div>'; }).join("");
      var centerText = center.lat != null && center.lon != null ? Number(center.lat).toFixed(4) + ', ' + Number(center.lon).toFixed(4) : '—';
      var relation = control.relationshipType || 'relationship tidak dinyatakan';

      elInsp.innerHTML =
        '<div class="insp-title">' + escapeHtml(h.company) + '</div>' +
        '<div class="insp-subtitle">' + escapeHtml(h.sector || '') + ' · ' + escapeHtml(h.province || '') + '</div>' +
        '<div class="insp-id">OBJ/' + escapeHtml(String(h.id || '').toUpperCase()) + ' · LandHolding / Control</div>' +
        '<div class="summary-grid">' +
          '<div class="summary-card"><span class="label">Reported permit area</span><strong>' + escapeHtml(formatAreaHa(h.areaHa)) + '</strong><small>' + escapeHtml(h.permitType || 'izin tidak dinyatakan') + '</small></div>' +
          '<div class="summary-card"><span class="label">Map geometry</span><strong>PERKIRAAN LUAS IZIN</strong><small>bukan batas legal konsesi</small></div>' +
          '<div class="summary-card"><span class="label">Control link</span><strong>' + escapeHtml(control.group || 'Tidak terpetakan') + '</strong><small>' + escapeHtml(relation) + ' · confidence ' + escapeHtml(control.confidence || '—') + '</small></div>' +
          '<div class="summary-card"><span class="label">Display center</span><strong>' + escapeHtml(center.precision || 'approximate') + '</strong><small>' + escapeHtml(center.label || centerText) + '</small></div>' +
        '</div>' +
        '<div class="caveat" style="border-color:#6f9fc8"><strong>SCHEMATIC EQUAL-AREA CIRCLE</strong><br/>Radius dihitung dari luas izin yang dilaporkan. Bentuk lingkaran bukan bentuk HGU/PBPH sebenarnya. Titik pusat juga dapat berupa pendekatan wilayah operasi sesuai label precision.</div>' +
        '<details class="details-section" open><summary>Ownership / control</summary><div class="section-content">' + persons + '</div></details>' +
        '<details class="details-section" open><summary>Permit details</summary><div class="section-content"><dl class="kv">' +
          '<dt>Permit type</dt><dd>' + escapeHtml(h.permitType || '—') + '</dd>' +
          '<dt>Permit number</dt><dd>' + escapeHtml(h.permitNumber || '—') + '</dd>' +
          '<dt>Status</dt><dd>' + escapeHtml(h.permitStatus || '—') + '</dd>' +
          '<dt>Reported area</dt><dd>' + escapeHtml(formatAreaHa(h.areaHa)) + '</dd>' +
          '<dt>Display center</dt><dd>' + escapeHtml(centerText) + '</dd>' +
          '</dl></div></details>' +
        '<details class="details-section"><summary>Sources (' + (h.sources || []).length + ')</summary><div class="section-content"><ul class="src-list">' + sources + '</ul></div></details>' +
        '<details class="details-section"><summary>Caveats (' + (h.caveats || []).length + ')</summary><div class="section-content">' + caves + '</div></details>';

      openMobileInspector();
    }

    function refreshEstimatedLandLayer() {
      estimatedLandLayer.clearLayers();
      landHoldings.forEach(function (h) {
        var center = h.displayCenter;
        if (!center || center.lat == null || center.lon == null) return;
        var radius = estimatedLandRadiusMeters(h.areaHa);
        if (!radius) return;
        var circle = L.circle([Number(center.lat), Number(center.lon)], {
          radius: radius,
          color: "#6f9fc8",
          weight: 2,
          opacity: 0.9,
          dashArray: "7 6",
          fillColor: "#6f9fc8",
          fillOpacity: 0.055
        });
        circle.bindTooltip(
          '<strong>' + escapeHtml(h.company) + '</strong><br/>' +
          'PERKIRAAN LUAS IZIN · ' + escapeHtml(formatAreaHa(h.areaHa)) + '<br/>' +
          '<span style="color:#9a968e">bukan batas legal · center: ' + escapeHtml(center.precision || 'approximate') + '</span>',
          { sticky: true, opacity: 0.96 }
        );
        circle.on("click", function () { showLandHolding(h); });
        estimatedLandLayer.addLayer(circle);
      });
    }

'''
          text = text.replace(marker, holding_helpers + marker, 1)

          replace_once(
              '    renderList();\n    refreshConcessionMarkers();\n    refreshFirmsLayer();',
              '    renderList();\n    refreshConcessionMarkers();\n    refreshEstimatedLandLayer();\n    refreshFirmsLayer();',
              'init layers'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m json.tool data/affiliated-land-holdings.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'data/affiliated-land-holdings.json',
              'PERKIRAAN LUAS IZIN · bukan batas legal',
              'function refreshEstimatedLandLayer()',
              'function showLandHolding(h)',
              'estimatedLandRadiusMeters'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('missing integration markers: ' + ', '.join(missing))
          print('integration markers OK')
          PY

      - name: Commit generated integration and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-estimated-land-circles.yml
          git add index.html data/affiliated-land-holdings.json
          git commit -m "feat: render affiliated holdings as estimated land circles"
          git push origin HEAD:feat/estimated-land-circles
