name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  boundary-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/meratus-boundaries-20260822
      - name: Fetch public boundary sources
        run: |
          set -euo pipefail
          python -m pip install --quiet pyshp
          rm -rf research-output
          python scripts/research_boundaries.py
      - name: Persist raw research output on research branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research-output
          if git diff --cached --quiet; then
            echo 'No research output changes'
            exit 0
          fi
          git commit -m 'chore: persist boundary research output'
          git push origin HEAD:research/meratus-boundaries-20260822

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
