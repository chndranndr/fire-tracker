name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure hotspot shard contract exists
        run: python scripts/bootstrap_hotspot_shards.py
      - name: Apply display-only land holding overlay
        run: python scripts/patch_land_holdings_dashboard.py
      - name: Apply Indonesia region-aware frontend
        run: python scripts/patch_region_dashboard.py
      - name: Apply concession inventory frontend
        run: python scripts/patch_concession_inventory_dashboard.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
