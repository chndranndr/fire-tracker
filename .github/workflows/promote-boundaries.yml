name: Temporary promote validated MERATUS boundaries

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-boundaries.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch validated candidate
        run: |
          set -euo pipefail
          git fetch origin research/meratus-boundaries-20260822
          git show origin/research/meratus-boundaries-20260822:research-output/final_boundaries.geojson > data/boundaries.geojson
          git show origin/research/meratus-boundaries-20260822:research-output/validation_report.json > /tmp/validation_report.json
      - name: Independently validate before promotion
        run: |
          set -euo pipefail
          python -m pip install --quiet shapely
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from shapely.geometry import shape
          from shapely.validation import explain_validity

          data=json.loads(Path('data/boundaries.geojson').read_text())
          report=json.loads(Path('/tmp/validation_report.json').read_text())
          expected={'kpc':1,'agm':2,'bre':1,'dwima':1,'kiani':1}
          assert report.get('ok') is True
          assert report.get('featureCount') == 6
          assert report.get('counts') == expected
          assert data.get('type') == 'FeatureCollection'
          feats=data.get('features',[])
          assert len(feats) == 6
          counts=Counter()

          def positions(node):
              if isinstance(node,list) and len(node)>=2 and all(isinstance(v,(int,float)) for v in node[:2]):
                  yield node
              elif isinstance(node,list):
                  for x in node:
                      yield from positions(x)

          for f in feats:
              assert f.get('type') == 'Feature'
              p=f.get('properties') or {}
              did=p.get('dossierId')
              assert did in expected
              counts[did]+=1
              assert isinstance(p.get('name'),str) and p['name']
              assert p.get('quality') == 'OFFICIAL'
              assert isinstance(p.get('source'),str) and 'Badan Informasi Geospasial' in p['source']
              assert isinstance(p.get('sourceUrl'),str) and p['sourceUrl'].startswith('https://kspservices.big.go.id/')
              g=f.get('geometry') or {}
              assert g.get('type') in {'Polygon','MultiPolygon'}
              pts=list(positions(g.get('coordinates')))
              assert pts
              assert all(len(pt)==2 for pt in pts)
              assert all(108.0 <= pt[0] <= 119.5 and -4.6 <= pt[1] <= 1.85 for pt in pts)
              geom=shape(g)
              assert not geom.is_empty
              assert geom.is_valid, explain_validity(geom)
              assert geom.area > 0
          assert dict(counts) == expected
          print('validated', len(feats), 'features', dict(counts))
          PY
      - name: Commit boundary data
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/boundaries.geojson
          git diff --cached --check
          git commit -m 'data: add verified official concession boundaries'
          git push origin HEAD:main
