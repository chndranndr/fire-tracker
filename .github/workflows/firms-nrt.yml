name: Refresh FIRMS NRT

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish data and deploy Pages; only honored on main"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: firms-nrt
  cancel-in-progress: false

jobs:
  ingest:
    outputs:
      should_publish: ${{ steps.publish-mode.outputs.should_publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine publish mode
        id: publish-mode
        env:
          SHOULD_PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish == true) }}
        run: echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Fetch and validate FIRMS
        id: ingest
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          set +e
          python scripts/ingest_firms.py
          result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          set -e

      - name: Commit dataset or pipeline status
        env:
          SHOULD_PUBLISH: ${{ steps.publish-mode.outputs.should_publish }}
        run: |
          if [ "$SHOULD_PUBLISH" != "true" ]; then
            echo "Validation-only run: no commit, push, or production Pages deploy."
            git status --short
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/firms.json data/firms-status.json
          if [ -d archive/firms ]; then git add archive/firms; fi
          if git diff --cached --quiet; then
            echo "No FIRMS or status changes to publish."
          else
            git commit -m "chore(data): refresh FIRMS NRT dataset"
            git push origin HEAD:main
          fi

      - name: Surface ingestion failure
        if: steps.ingest.outputs.result != '0'
        run: exit 1

      - name: Upload validation-only outputs
        if: steps.publish-mode.outputs.should_publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firms-nrt-validation-${{ github.run_id }}
          path: |
            data/firms.json
            data/firms-status.json
            archive/firms

      # The data commit above uses GITHUB_TOKEN. GitHub deliberately does not
      # start another push-triggered workflow for that commit, so publish the
      # same validated workspace through a separate deploy job below.
      - name: Configure GitHub Pages
        if: steps.publish-mode.outputs.should_publish == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload refreshed Pages artifact
        if: steps.publish-mode.outputs.should_publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: ingest
    if: needs.ingest.outputs.should_publish == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy refreshed Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
