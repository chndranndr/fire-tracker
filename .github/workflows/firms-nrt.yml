name: Refresh FIRMS NRT

on:
  schedule:
    - cron: "17 * * * *"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish data and deploy Pages; only honored on main"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: firms-nrt
  cancel-in-progress: false

jobs:
  ingest:
    outputs:
      should_publish: ${{ steps.publish-mode.outputs.should_publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Determine publish mode
        id: publish-mode
        env:
          SHOULD_PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish == true) }}
        run: echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Validate FIRMS pipeline offline
        if: github.event_name == 'pull_request'
        run: python scripts/validate_build.py

      - name: Fetch and validate FIRMS
        id: ingest
        if: github.event_name != 'pull_request'
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          set +e
          python scripts/ingest_firms.py
          result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          set -e

      - name: Build production dashboard
        if: ${{ always() && steps.publish-mode.outputs.should_publish == 'true' }}
        run: python scripts/build_dashboard.py

      - name: Validate build regression gate
        if: ${{ always() && steps.publish-mode.outputs.should_publish == 'true' }}
        run: python scripts/validate_build.py

      - name: Configure GitHub Pages
        if: ${{ always() && steps.publish-mode.outputs.should_publish == 'true' }}
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload refreshed Pages artifact
        if: ${{ always() && steps.publish-mode.outputs.should_publish == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Surface ingestion failure
        if: ${{ always() && github.event_name != 'pull_request' && steps.ingest.outputs.result != '0' }}
        run: exit 1

  deploy:
    needs: ingest
    if: ${{ always() && needs.ingest.outputs.should_publish == 'true' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy refreshed Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
