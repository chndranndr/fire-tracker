name: Refresh FIRMS NRT

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: firms-nrt
  cancel-in-progress: false

jobs:
  ingest:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate FIRMS
        id: ingest
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          set +e
          python scripts/ingest_firms.py
          result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          set -e

      - name: Commit dataset or pipeline status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/firms.json data/firms-status.json
          if [ -d archive/firms ]; then git add archive/firms; fi
          if git diff --cached --quiet; then
            echo "No FIRMS or status changes to publish."
          else
            git commit -m "chore(data): refresh FIRMS NRT dataset"
            git push origin HEAD:main
          fi

      - name: Surface ingestion failure
        if: steps.ingest.outputs.result != '0'
        run: exit 1

      # The data commit above uses GITHUB_TOKEN. GitHub deliberately does not
      # start another push-triggered workflow for that commit, so deploy the
      # same validated workspace here instead of relying on pages.yml.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload refreshed Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy refreshed Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
